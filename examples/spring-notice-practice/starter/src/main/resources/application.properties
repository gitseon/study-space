spring.application.name=spring-notice-practice
spring.datasource.url=${PRACTICE_DB_URL:jdbc:mysql://127.0.0.1:3306/spring_notice_practice}
spring.datasource.username=${PRACTICE_DB_USER}
spring.datasource.password=${PRACTICE_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
