name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Safety net: push-triggered runs have not been created for this repository,
  # so a scheduled run deploys main whenever its latest commit is not yet live.
  schedule:
    - cron: "17,47 * * * *"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // ""')
          echo "live=$live main=${{ github.sha }}"
          if [ "$live" = "${{ github.sha }}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: pending
    if: needs.pending.outputs.deploy == 'true'
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
