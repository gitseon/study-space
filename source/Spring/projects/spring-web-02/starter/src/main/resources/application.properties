spring.application.name=equipment-rental
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/equipment_rental?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:study}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.study.rental.model
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.study.rental=debug
